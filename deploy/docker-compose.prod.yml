# Production deployment on any Docker host (VPS, Fly.io, Koyeb, Hetzner…).
# Images are published to GHCR by .github/workflows/cd.yml on every push to main.
#
# Required env (set in deploy/.env):
#   IMAGE_PREFIX     e.g. ghcr.io/yourname/stock-eye
#   AUTH_SECRET      openssl rand -base64 32
#   POSTGRES_PASSWORD
#   DOMAIN           (optional, for the Caddy-less reverse proxy docs)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockeye
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: stockeye
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockeye -d stockeye"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX e.g. ghcr.io/yourname/stock-eye}/api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://stockeye:${POSTGRES_PASSWORD}@postgres:5432/stockeye
      CORS_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX e.g. ghcr.io/yourname/stock-eye}/web:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://stockeye:${POSTGRES_PASSWORD}@postgres:5432/stockeye
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      ML_API_URL: "http://api:8000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
