services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockeye
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockeye_prod_password}
      POSTGRES_DB: stockeye
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockeye -d stockeye"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://stockeye:${POSTGRES_PASSWORD:-stockeye_prod_password}@postgres:5432/stockeye
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in your .env}
      AUTH_TRUST_HOST: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
